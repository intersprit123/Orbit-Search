name: Orbit free API checks

on:
  push:
    branches: [main, feature/free-provider-integrations]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile orbit_api_hub.py orbit_free_apis.py orbit_extra_apis.py advanced_features.py
      - name: Run no-network adapter tests
        run: python -m unittest discover -s tests -v
